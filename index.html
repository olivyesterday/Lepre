<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Lepre</title>
<style>
  :root {
    --bg: #111214; --card: #1c1d21; --line: #2c2e33;
    --text: #f2f2f0; --muted: #9a9ba1; --accent: #e8f4ff; --glow: #9fd0ff;
    --ok: #7dd97d; --warn: #f0b45a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: .2px; }
  .pill { font-size: 13px; padding: 6px 12px; border-radius: 99px; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .pill.on { color: var(--ok); border-color: #2f5a2f; }
  .pill.attesa { color: var(--warn); border-color: #6a5330; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  button { font: inherit; color: var(--text); background: #2a2c31; border: 1px solid var(--line);
           border-radius: 14px; padding: 16px; min-height: 56px; cursor: pointer; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; }
  .primary { background: var(--accent); color: #0d1a26; border: none; font-weight: 650; width: 100%; }
  .big { font-size: 44px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: center; }
  .unit { font-size: 15px; color: var(--muted); font-weight: 400; }
  input[type=range] { width: 100%; height: 44px; accent-color: var(--glow); }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .leds { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px; }
  .led { flex: 1; aspect-ratio: 1; max-width: 44px; border-radius: 50%; background: #26282d; transition: background .12s, box-shadow .12s; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
  .go { background: #23402a; border-color: #2f5a2f; font-weight: 650; }
  .go.aspetta { background: #262b27; border-color: #34423a; color: #b9c7bd; font-weight: 500; }
  .stop { background: #46262a; border-color: #6a3036; font-weight: 650; }
  .warn { color: var(--warn); }
  .seg { display: flex; background: #26282d; border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; min-height: 44px; padding: 10px; border: none; background: transparent; color: var(--muted); }
  .seg button.sel { background: #3a3d44; color: var(--text); font-weight: 600; }
  .seg.bloccato { opacity: .45; pointer-events: none; }
  #via { width: 100%; min-height: 64px; font-size: 20px; }
  .stats { display: flex; justify-content: space-between; margin-top: 12px; text-align: center; }
  .stats div { flex: 1; }
  .stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--muted); }
  #sveglia { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lepre luminosa</h1>
    <span id="stato" class="pill">Non collegata</span>
  </header>

  <button id="collega" class="primary">Collega la lepre</button>
  <p id="avviso" class="hint warn" hidden></p>

  <div class="seg" role="tablist">
    <button id="modoSim" class="sel">Simulazione</button>
    <button id="modoGps">Corsa reale (GPS)</button>
  </div>

  <section class="card">
    <div class="label"><span>Passo della lepre</span></div>
    <div class="big"><span id="obiettivo">6:00</span> <span class="unit">/km</span></div>
    <input id="cursoreLepre" type="range" min="180" max="900" step="5" value="360" aria-label="Passo della lepre">
    <div class="scale"><span>3:00 veloce</span><span>15:00 lento</span></div>
  </section>

  <section class="card">
    <div class="label"><span id="titoloPasso">Il tuo passo (simulato)</span><span id="segnale"></span></div>
    <div class="big"><span id="passo">6:00</span> <span class="unit">/km</span></div>
    <div id="zonaSim">
      <input id="cursore" type="range" min="180" max="1200" step="5" value="360" aria-label="Il tuo passo">
      <div class="scale"><span>3:00 veloce</span><span>20:00 lento</span></div>
    </div>
    <div id="zonaGps" class="stats" hidden>
      <div><b id="kmh">0,0</b><span>km/h</span></div>
      <div><b id="tempo">0:00</b><span>tempo</span></div>
      <div><b id="distanza">0,00</b><span>km</span></div>
      <div><b id="cadenza">–</b><span>passi/min</span></div>
    </div>
  </section>

  <section class="card">
    <div class="label"><span>Cosa vede il runner</span></div>
    <div class="leds" id="leds"></div>
  </section>

  <button id="via" class="go">Via</button>
  <p class="hint" id="nota">Tieni lo schermo acceso durante la prova.</p>
  <p class="hint" style="opacity:.5">versione 4.0</p>
</main>

<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dc4c01';
const COMANDI_UUID = '6e400002-b5a3-f393-e0a9-e50e24dc4c01';
const STATO_UUID   = '6e400003-b5a3-f393-e0a9-e50e24dc4c01';
const SCARTO_REL = 0.25;       // stesso valore della scheda: ±25% dal passo della lepre = bordo
const PRECISIONE_MAX = 20;     // metri: punti GPS meno precisi vengono scartati
const PASSO_FERMO = 30 * 60;   // sotto 2 km/h si considera fermo
const PUNTI_PER_PRONTO = 3;    // punti GPS buoni di fila per dire "GPS pronto"

let comandi = null, statoChar = null, dispositivo = null;
let vogliamoScollegare = false, riconnessione = false;
let modo = 'sim';
let obiettivo = 360;           // secondi al km
let passo = 360;               // secondi al km
let inCorsa = false;
let coda = Promise.resolve();

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const salva = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leggi = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

// ---------- LED simulati sullo schermo ----------
const leds = [];
for (let i = 0; i < 6; i++) { const d = document.createElement('div'); d.className = 'led'; $('leds').appendChild(d); leds.push(d); }
function disegnaLed() {
  const centro = 2.5;
  let pos = centro;
  if (inCorsa) {
    const scarto = Math.max(-1, Math.min(1, (passo - obiettivo) / (obiettivo * SCARTO_REL)));
    pos = centro + scarto * (centro - 0.2);
  }
  leds.forEach((d, i) => {
    let v = Math.max(0, 1 - Math.abs(i - pos));
    if (!inCorsa) v = (i === 2 || i === 3) ? 0.35 : 0;
    d.style.background = v > 0 ? `rgba(159,208,255,${0.15 + 0.85 * v})` : '#26282d';
    d.style.boxShadow = v > 0.5 ? `0 0 ${18 * v}px rgba(159,208,255,${v})` : 'none';
  });
}

// ---------- Bluetooth ----------
function invia(testo) {
  if (!comandi) return;
  const c = comandi, dati = new TextEncoder().encode(testo);
  coda = coda.then(() => c.writeValueWithoutResponse ? c.writeValueWithoutResponse(dati) : c.writeValue(dati)).catch(() => {});
}
const inviaPasso = () => invia('P' + (passo / 60).toFixed(2));
const inviaObiettivo = () => invia('T' + (obiettivo / 60).toFixed(2));

function avvisa(testo) { $('avviso').hidden = !testo; $('avviso').textContent = testo || ''; }
function pill(testo, classe) { $('stato').textContent = testo; $('stato').className = 'pill' + (classe ? ' ' + classe : ''); }

async function apriConnessione() {
  const server = await dispositivo.gatt.connect();
  const servizio = await server.getPrimaryService(SERVICE_UUID);
  comandi = await servizio.getCharacteristic(COMANDI_UUID);
  try { statoChar = await servizio.getCharacteristic(STATO_UUID); } catch (e) { statoChar = null; }  // scheda vecchia
  pill('Collegata', 'on');
  $('collega').textContent = 'Lepre collegata';
  $('collega').disabled = true;
  inviaObiettivo();
  if (modo === 'sim' || inCorsa) inviaPasso();
}

async function collega() {
  if (!navigator.bluetooth) {
    avvisa('Questo browser non può usare il Bluetooth. Su iPhone apri la pagina con l’app Bluefy, su Android con Chrome.');
    return;
  }
  tieniSveglio();
  try {
    $('collega').disabled = true;
    $('collega').textContent = 'Collegamento…';
    dispositivo = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'Lepre' }, { services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID]
    });
    dispositivo.addEventListener('gattserverdisconnected', scollegato);
    vogliamoScollegare = false;
    await apriConnessione();
    avvisa('');
  } catch (e) {
    $('collega').disabled = false;
    $('collega').textContent = 'Collega la lepre';
    avvisa('Collegamento non riuscito. Controlla che la scheda sia accesa e riprova.');
  }
}

// connessione caduta: si riprova da soli ogni 2 secondi, per un minuto
async function scollegato() {
  comandi = null; statoChar = null;
  if (vogliamoScollegare || riconnessione) return;
  riconnessione = true;
  pill('Riconnessione…', 'attesa');
  for (let i = 0; i < 30 && !comandi; i++) {
    try { await apriConnessione(); } catch (e) { await new Promise(r => setTimeout(r, 2000)); }
  }
  riconnessione = false;
  if (!comandi) {
    pill('Non collegata');
    $('collega').disabled = false;
    $('collega').textContent = 'Ricollega la lepre';
  }
}

// lo stato della scheda, letto ogni secondo: app e lepre restano allineate
function leggiStatoScheda() {
  if (!statoChar) return;
  const s = statoChar;
  coda = coda.then(() => s.readValue()).then(v => gestisciStato(new TextDecoder().decode(v).trim())).catch(() => {});
}
function gestisciStato(s) {
  if (s === 'C' && !inCorsa) parti(false);                           // partita dal pulsante della scheda
  else if (s === 'F' && inCorsa) ferma(false);                       // fermata dal pulsante della scheda
  else if (s === 'A' && inCorsa && Date.now() - inizio > 4000) invia('V');   // la scheda si è riavviata
}

// ---------- schermo sempre acceso ----------
let wakeLock = null;
function tieniSveglio() {
  try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => wakeLock = w).catch(() => {}); } catch (e) {}
  const v = $('sveglia');                                            // piano B: video muto invisibile
  try { const p = v.play(); if (p) p.catch(() => {}); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (comandi || inCorsa)) tieniSveglio(); });

// ---------- Il tuo passo: GPS + passi, uniti ----------
const FALCATA_INIZIALE = 0.95;   // metri per passo di corsa: poi l'app impara la tua dal GPS
const FALCATA_CAMMINATA = 0.65;  // metri per passo camminando
let watchId = null, ultimoPunto = null, distanzaTot = 0, inizio = 0;
let velGps = null, tGps = 0;     // ultima velocità GPS (m/s) e quando è arrivata
let velocita = 0;                // la velocità stimata, in m/s: parte da 0
let puntiBuoni = 0, gpsPronto = false;
let falcata = FALCATA_INIZIALE;
{ const f = Number(leggi('falcata')); if (f > 0.5 && f < 2) falcata = f; }

function metri(a, b) {   // distanza tra due punti GPS
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

let avvisoGps = false;
function nuovoPunto(p) {
  const c = p.coords;
  if (avvisoGps) { avvisa(''); avvisoGps = false; }
  const qualita = c.accuracy <= 10 ? 'GPS buono' : c.accuracy <= PRECISIONE_MAX ? 'GPS discreto' : 'GPS debole';
  $('segnale').textContent = `${qualita} (±${Math.round(c.accuracy)} m)`;
  if (c.accuracy > PRECISIONE_MAX) { puntiBuoni = 0; return; }
  puntiBuoni++;
  if (puntiBuoni >= PUNTI_PER_PRONTO && !gpsPronto) { gpsPronto = true; aggiornaVia(); }
  const punto = { t: p.timestamp, lat: c.latitude, lon: c.longitude };
  let v = (c.speed != null && c.speed >= 0) ? c.speed : null;   // velocità misurata dal telefono
  if (ultimoPunto) {
    const d = metri(ultimoPunto, punto), dt = (punto.t - ultimoPunto.t) / 1000;
    if (inCorsa && d < 50) distanzaTot += d;      // salti enormi = errore del GPS
    if (v == null && dt > 0.5) v = d / dt;        // altrimenti: strada fatta / tempo
  }
  ultimoPunto = punto;
  if (v != null) { velGps = velGps == null ? v : 0.5 * velGps + 0.5 * v; tGps = Date.now(); }
}

// ogni mezzo secondo: unisce GPS e passi in un'unica velocità
function stimaVelocita() {
  const cad = cadenzaAttuale();
  const gpsOk = velGps != null && Date.now() - tGps < 3000;
  if (gpsOk && cad > 140 && velGps > 1.5) {       // corsa con buon GPS: impara la falcata
    const f = velGps / (cad / 60);
    if (f > 0.5 && f < 2) { falcata = 0.97 * falcata + 0.03 * f; salva('falcata', falcata.toFixed(3)); }
  }
  const velPassi = cad > 0 ? (cad / 60) * (cad < 140 ? FALCATA_CAMMINATA : falcata) : 0;
  let v;
  if (gpsOk && cad > 0) v = 0.5 * velGps + 0.5 * velPassi;   // entrambi: media
  else if (gpsOk) v = velGps;                                // solo GPS
  else v = velPassi;                                         // GPS assente: solo passi
  velocita += (v - velocita) * 0.35;                         // risposta in circa 2 secondi
  if (velocita < 0.05) velocita = 0;
  if (!gpsOk) distanzaTot += velocita * 0.5;                 // senza GPS: distanza dai passi
  passo = velocita > 1000 / PASSO_FERMO ? 1000 / velocita : PASSO_FERMO;
}

// il GPS si accende appena scegli "Corsa reale", così al Via è già pronto
function avviaGps() {
  if (watchId != null) return;
  if (!('geolocation' in navigator)) { avvisa('Questo browser non può usare il GPS.'); return; }
  puntiBuoni = 0; gpsPronto = false; ultimoPunto = null; velGps = null;
  $('segnale').textContent = 'Cerco il GPS…';
  watchId = navigator.geolocation.watchPosition(nuovoPunto,
    e => {
      if (e.code === 1) avvisa('Permesso di posizione negato: attivalo nelle impostazioni del browser.');
      else if (!ultimoPunto) { avvisa('Il GPS non risponde ancora: all’aperto si stabilizza. Al chiuso il passo si stima dai passi.'); avvisoGps = true; }
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function fermaGps() { if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; gpsPronto = false; }

// ---------- Accelerometro: i passi ----------
let passi = [], filtro = 9.8, media = 9.8, scarto = 1, sopra = false, ultimoPassoT = 0;

function movimento(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  const forza = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  filtro = 0.75 * filtro + 0.25 * forza;                    // ammorbidisce le vibrazioni
  media = 0.98 * media + 0.02 * filtro;                     // livello di riposo
  scarto = 0.98 * scarto + 0.02 * Math.abs(filtro - media); // quanto "rimbalza" il telefono
  const soglia = media + Math.max(1.0, scarto);             // si adatta a mano, fascia o tasca
  const ora = performance.now();
  if (!sopra && filtro > soglia && ora - ultimoPassoT > 250) {   // picco = un appoggio del piede
    sopra = true; ultimoPassoT = ora; passi.push(ora);
  }
  if (filtro < media) sopra = false;
  passi = passi.filter(t => ora - t < 10000);
}
// cadenza dagli ultimi passi (mediana degli intervalli): reagisce in pochi secondi
function cadenzaAttuale() {
  const ora = performance.now();
  if (passi.length < 4 || ora - passi.at(-1) > 2000) return 0;
  const recenti = passi.slice(-7), intervalli = [];
  for (let i = 1; i < recenti.length; i++) intervalli.push(recenti[i] - recenti[i - 1]);
  intervalli.sort((x, y) => x - y);
  return Math.round(60000 / intervalli[Math.floor(intervalli.length / 2)]);
}

async function avviaSensori() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const r = await DeviceMotionEvent.requestPermission();   // chiesto su iPhone (e alcuni Android)
      if (r !== 'granted') avvisa('Permesso di movimento negato: i passi non verranno contati, resta solo il GPS.');
    }
  } catch (e) {}
  window.addEventListener('devicemotion', movimento);
}

// ---------- modalità ----------
function scegliModo(m) {
  if (inCorsa) return;
  modo = m;
  salva('modo', m);
  $('modoSim').classList.toggle('sel', m === 'sim');
  $('modoGps').classList.toggle('sel', m === 'gps');
  $('zonaSim').hidden = m !== 'sim';
  $('zonaGps').hidden = m !== 'gps';
  $('titoloPasso').textContent = m === 'sim' ? 'Il tuo passo (simulato)' : 'Il tuo passo (GPS + passi)';
  $('segnale').textContent = '';
  $('nota').textContent = m === 'sim' ? 'Tieni lo schermo acceso durante la prova.'
    : 'All’aperto aspetta “GPS pronto”. Al chiuso puoi partire lo stesso: il passo si stima dai passi.';
  if (m === 'sim') { fermaGps(); passo = Number($('cursore').value); }
  else { velocita = 0; passo = PASSO_FERMO; avviaGps(); }   // la corsa reale parte da zero
  aggiornaVia();
  aggiorna();
}

// ---------- Via / Stop ----------
function parti(daApp = true) {
  if (inCorsa) return;
  inCorsa = true; inizio = Date.now();
  if (modo === 'gps') {
    if (daApp) avviaSensori(); else window.addEventListener('devicemotion', movimento);
    passi = []; distanzaTot = 0; velocita = 0; passo = PASSO_FERMO; avviaGps();
  }
  tieniSveglio();
  if (daApp) invia('V');
  inviaPasso();
  document.querySelector('.seg').classList.add('bloccato');
  aggiornaVia();
  aggiorna();
}
function ferma(daApp = true) {
  if (!inCorsa) return;
  inCorsa = false;
  window.removeEventListener('devicemotion', movimento);
  if (daApp) invia('S');
  document.querySelector('.seg').classList.remove('bloccato');
  if (modo === 'gps') { velocita = 0; passo = PASSO_FERMO; }
  aggiornaVia();
  aggiorna();
}
function aggiornaVia() {
  const b = $('via');
  if (inCorsa) { b.textContent = 'Stop'; b.className = 'stop'; return; }
  if (modo === 'gps' && !gpsPronto) { b.textContent = 'Via · GPS non ancora pronto'; b.className = 'go aspetta'; }
  else { b.textContent = modo === 'gps' ? 'Via · GPS pronto' : 'Via'; b.className = 'go'; }
}

// ---------- controlli ----------
$('collega').onclick = collega;
$('modoSim').onclick = () => scegliModo('sim');
$('modoGps').onclick = () => scegliModo('gps');
$('cursoreLepre').oninput = e => { obiettivo = Number(e.target.value); salva('obiettivo', obiettivo); aggiorna(); inviaObiettivo(); };
$('cursore').oninput = e => { passo = Number(e.target.value); aggiorna(); };
$('via').onclick = () => { if (inCorsa) ferma(); else parti(); };

function aggiorna() {
  $('obiettivo').textContent = fmt(obiettivo);
  $('kmh').textContent = (velocita * 3.6).toFixed(1).replace('.', ',');
  $('passo').textContent = (modo === 'gps' && passo >= PASSO_FERMO) ? '–:–' : fmt(passo);
  disegnaLed();
}

// ogni 250 ms: passo alla scheda · ogni 500 ms: nuova stima · ogni secondo: stato, tempo e distanza
setInterval(() => { if (comandi && (modo === 'sim' || inCorsa)) inviaPasso(); }, 250);
setInterval(() => { if (inCorsa && modo === 'gps') { stimaVelocita(); aggiorna(); } }, 500);
setInterval(() => {
  leggiStatoScheda();
  if (!inCorsa || modo !== 'gps') return;
  $('tempo').textContent = fmt((Date.now() - inizio) / 1000);
  $('distanza').textContent = (distanzaTot / 1000).toFixed(2).replace('.', ',');
  const c = cadenzaAttuale();
  $('cadenza').textContent = c ? c : '–';
  invia('C' + c);
}, 1000);

// all'apertura: riprende le ultime impostazioni
{ const o = Number(leggi('obiettivo')); if (o >= 180 && o <= 900) { obiettivo = o; $('cursoreLepre').value = o; } }
scegliModo(leggi('modo') === 'gps' ? 'gps' : 'sim');
</script>
